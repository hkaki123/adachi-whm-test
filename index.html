<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>足立区Webハザードマップ</title>
  <meta name="description" content="東京都足立区のWebハザードマップ（地震／洪水／高潮／内水）。国・東京都のオープンデータを活用した試作版">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=20261125">
</head>
<body class="intro">
  <header class="intro-head">
    <div class="intro-head-in">
      <h1 data-i18n="title">足立区Webハザードマップ</h1>
      <label class="lang">
        <span class="lang-ico" aria-hidden="true">🌐</span>
        <span class="sr">Language</span>
        <select id="langSel" aria-label="Language"></select>
      </label>
    </div>
  </header>

  <main class="intro-main">
    <section class="card">
      <h2 data-i18n="introTitle">ご利用にあたって</h2>
      <p class="lead" data-i18n="introLead"></p>
      <p class="agree" data-i18n="introAgree"></p>
      <h3 data-i18n="introChoose"></h3>
      <nav class="hz-grid hz-grid-4" id="hzGrid"></nav>
    </section>

    <section class="card">
      <h3 data-i18n="introAbout"></h3>
      <ul>
        <li data-i18n="introAbout_eq"></li>
        <li data-i18n="introAbout_flood"></li>
        <li data-i18n="introAbout_takashio"></li>
        <li data-i18n="introAbout_naisui"></li>
        <li data-i18n="introAbout_other"></li>
      </ul>
      <h3 data-i18n="introCaution"></h3>
      <ul>
        <li data-i18n="introCaution1"></li>
        <li data-i18n="introCaution2"></li>
      </ul>
      <h3 data-i18n="introTerms"></h3>
      <ul>
        <li data-i18n="introTerms1"></li>
        <li data-i18n="introTerms2"></li>
        <li data-i18n="introTerms3"></li>
        <li data-i18n="introTerms4"></li>
        <li data-i18n="introTerms5"></li>
      </ul>
      <h3 data-i18n="introData"></h3>
      <ul>
        <li data-i18n="introData1"></li>
        <li data-i18n="introData2"></li>
        <li data-i18n="introData3"></li>
        <li data-i18n="introData4"></li>
      </ul>
      <h3 id="search" data-i18n="introSearch"></h3>
      <ul>
        <li data-i18n="introSearch1"></li>
      </ul>
    </section>
  </main>
  <footer class="intro-foot" data-i18n="copyright">足立区Webハザードマップ</footer>

  <script src="js/config.js?v=20261125"></script>
  <script src="js/i18n.js?v=20261125"></script>
  <script src="js/i18n-adachi.js?v=20261125"></script>
  <script>
    (function () {
      const I = window.WHM_I18N, t = I.t;
      const ICONS = {
        eq: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><path d="M10 40V22l14-11 14 11v18z"/><path d="M4 30l6-4 4 6 6-8 5 7 5-5 4 5 6-3" stroke-width="2.5"/><path d="M6 8c6 0 6 6 12 6M30 14c6 0 6-6 12-6" stroke-width="2.5"/></svg>',
        flood: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><path d="M10 28V14l14-9 14 9v14"/><path d="M4 32c4 0 4 3 8 3s4-3 8-3 4 3 8 3 4-3 8-3 4 3 8 3M4 41c4 0 4 3 8 3s4-3 8-3 4 3 8 3 4-3 8-3 4 3 8 3" stroke-width="2.6"/></svg>',
        dosha: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><path d="M4 42L22 8l22 34z"/><circle cx="18" cy="32" r="3" fill="#fff"/><circle cx="27" cy="36" r="2.5" fill="#fff"/><circle cx="33" cy="30" r="2" fill="#fff"/><path d="M22 18l-4 8M28 22l-2 5" stroke-width="2.5"/></svg>',
        takashio: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M4 30c6-14 22-20 30-12-6 0-9 4-7 8 3 6 13 4 17 0"/><path d="M4 40c4 0 4 3 8 3s4-3 8-3 4 3 8 3 4-3 8-3 4 3 8 3" stroke-width="2.6"/><path d="M36 6l-4 6M42 10l-5 4" stroke-width="2.5"/></svg>',
        naisui: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M10 14c0-6 6-9 12-7 2-4 12-4 14 2 6 0 8 6 4 9H10c-3 0-4-3 0-4z"/><path d="M14 24l-2 5M22 24l-2 5M30 24l-2 5M38 24l-2 5" stroke-width="2.5"/><path d="M4 38h40M14 38v-3h20v3" stroke-width="2.6"/><path d="M8 44c3 0 3-2 6-2s3 2 6 2 3-2 6-2 3 2 6 2 3-2 6-2" stroke-width="2.2"/></svg>',
      };
      const CATS = ["eq", "flood", "takashio", "naisui"];
      function render() {
        I.applyStatic();
        document.title = t("title");
        document.getElementById("hzGrid").innerHTML = CATS.map((c) =>
          `<a class="hz-btn hz-${c}" href="map.html?lang=${encodeURIComponent(I.lang)}#${c}">${ICONS[c]}<span>${t("cat_" + c)}</span></a>`).join("");
      }
      I.buildSelect(document.getElementById("langSel"), (l) => {
        I.setLang(l);
        const u = new URL(location.href); u.searchParams.set("lang", l);
        history.replaceState(null, "", u.pathname + u.search + u.hash);
        render();
      });
      render();
    })();
  </script>
</body>
</html>
